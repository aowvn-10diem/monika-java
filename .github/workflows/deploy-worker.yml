name: deploy-worker

# Đưa Worker api.justmonika.top (thư mục cloudflare/) lên Cloudflare.
# Cần 2 secret của repo: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (tài khoản Cloudflare RIÊNG của Monika Java).
# Secret của Worker (PD_KEY, SYNC_TOKEN, UP_TOKEN, ...) giữ nguyên, workflow không đụng tới.
# Chạy tay: tab Actions > deploy-worker > Run workflow. Chạy tự động khi merge vào main có sửa cloudflare/.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/project-thread-y1dif7]
    paths:
      - "cloudflare/**"

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test (node:sqlite làm D1 giả)
        run: |
          node tools/gen-taxonomy.mjs --check
          node cloudflare/test/rank.test.mjs
          node cloudflare/test/ext.test.mjs
          node cloudflare/test/shot.test.mjs
      - name: Deploy Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Thiếu secret CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          npx --yes wrangler@4 deploy
      - name: Kiểm tra endpoint sau deploy
        run: |
          sleep 10
          fail=0
          for p in "v1/cats.json" "v1/home2.bin" "v1/list.json?key=top7" "v1/stats.json" "v1/l/new/0.bin"; do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://api.justmonika.top/$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || fail=1
          done
          exit $fail
