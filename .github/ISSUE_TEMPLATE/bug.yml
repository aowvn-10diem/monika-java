name: Lỗi
description: Báo lỗi trên máy thật hoặc trình giả lập
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Máy hoặc trình giả lập
      description: Ví dụ E72, E52, MicroEmulator 2.0.4.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và kết quả thực tế
    validations:
      required: true
